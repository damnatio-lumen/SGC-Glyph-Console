<style>

.gate-fixed{fill:none;stroke:#2d8db9;stroke-width:2}.gate-fixed-dim{fill:none;stroke:#174d69;stroke-width:1.3}.rotating-ring circle,.rotating-ring path,.rotating-ring line{vector-effect:non-scaling-stroke}.ring-symbol{font-family:SGCGlyph,'Segoe UI Symbol',sans-serif;fill:#72c9e8;font-size:22px;text-anchor:middle;dominant-baseline:middle;opacity:.9}.ring-symbol.origin{fill:#d2f8ff}.ring-tick{stroke:#236c91;stroke-width:1.1}.ring-tick.major{stroke:#54b9df;stroke-width:2}.gate-cross{stroke:#266d8c;stroke-width:1;opacity:.45}.chevron{fill:#071521;stroke:#3a8db2;stroke-width:4;stroke-linejoin:round;opacity:.8}.chevron.active{fill:#3c1112;stroke:#f04d42;stroke-width:6;filter:url(#redGlow);opacity:1;animation:chevronLock .52s ease-out 1}.chevron.active path{stroke:#ff8b71}.chevron.unused{opacity:.35}.circuit{fill:none;stroke:#27799e;stroke-width:2;opacity:.75}.circuit.active{stroke:#f05246;stroke-width:3.2;filter:url(#redGlow);opacity:1}.result-box{fill:#030c14;stroke:#287fa8;stroke-width:2}.result-box.active{stroke:#e95b4e;stroke-width:3;filter:url(#redGlow);animation:resultLock .48s ease-out 1}.result-top{stroke:#63bce2;stroke-width:5}.result-index{fill:#90d8f4;font-size:24px;text-anchor:end}.result-glyph{font-family:SGCGlyph,'Segoe UI Symbol',sans-serif;fill:#e1fbff;font-size:54px;text-anchor:middle;dominant-baseline:middle;opacity:0}.result-glyph.visible{opacity:1}.result-code{fill:#3b8db2;font-size:12px;text-anchor:middle}.hero-glyph{font-family:SGCGlyph,'Segoe UI Symbol',sans-serif;fill:#ddfaff;stroke:#a6f0ff;stroke-width:1.8;paint-order:stroke fill;text-anchor:middle;dominant-baseline:middle;filter:url(#blueGlow);opacity:0}.fly-glyph{font-family:SGCGlyph,'Segoe UI Symbol',sans-serif;fill:#e6fdff;stroke:#a6f0ff;stroke-width:1.4;paint-order:stroke fill;text-anchor:middle;dominant-baseline:middle;filter:url(#blueGlow)}
.status-line{fill:#d3f7ff;font-size:25px;letter-spacing:2.5px}.progress-caption{fill:#62c7ea;font-size:15px;letter-spacing:1.5px}.progress-bar{fill:#12364a;stroke:#297ca1;stroke-width:1}.progress-seg{fill:#092234;stroke:#1c6285;stroke-width:1}.progress-seg.done{fill:#de5147;stroke:#ff8a6f;filter:url(#redGlow)}.check-row{fill:none;stroke:#256c8d;stroke-width:1}.check-box{fill:#06131d;stroke:#2e83a8;stroke-width:1.3}.check-box.done{fill:#bb4239;stroke:#ff8674}.check-text{fill:#5eb5dc;font-size:19px}.check-ok{fill:#a5edff;font-size:13px;letter-spacing:1px}.left-bar{fill:#9b3a34;opacity:.22}.left-bar.done{opacity:.95;filter:url(#redGlow)}
.diagnostic-cell{fill:#071c28;stroke:#1d5875;stroke-width:1}.diagnostic-fill{fill:#2b91bd}.scan{stroke:#64d9f6;stroke-width:1.5;opacity:.6;animation:scan 3.8s linear infinite}.blink{animation:blink 1s steps(2,end) infinite}.pulse{animation:pulse 1.6s ease-in-out infinite}@keyframes scan{from{transform:translateY(0)}to{transform:translateY(48px)}}@keyframes blink{50%{opacity:.15}}@keyframes pulse{50%{opacity:.5}}@keyframes chevronLock{0%{opacity:.35}45%{opacity:1;stroke-width:9}100%{opacity:1;stroke-width:6}}@keyframes resultLock{0%{stroke-width:2;opacity:.55}55%{stroke-width:5;opacity:1}100%{stroke-width:3;opacity:1}}
@media(prefers-reduced-motion:reduce){.scan,.blink,.pulse,.chevron.active,.result-box.active{animation:none!important}}

<script>
'use strict';
const SVG_NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const addressRaw=params.get('address')||'';
const sourceMode=params.get('mode')==='vector'?'vector':'glyph';
const map=[];
for(let n=1;n<=39;n++){
 const key=n<=9?String(n):n===10?'0':n<=36?String.fromCharCode(65+n-11):n===37?',':n===38?'.':'-';
 map.push({n,key,vector:String(n).padStart(2,'0')});
}
const byVector=new Map(map.map(x=>[x.vector,x]));
const lockAngles=[50,10,330,210,170,130,90];
const physicalAngles=[90,50,10,330,290,250,210,170,130];
const cx=743,cy=513,outerR=315;
let selected=[],running=false,stopRequested=false,rotationNow=0;
function svg(tag,attrs={},parent){const el=document.createElementNS(SVG_NS,tag);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,String(v));if(parent)parent.appendChild(el);return el;}
function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms));}
function setText(id,text){$(id).textContent=text;}
function setDestinationLabel(){
 const code=selected.map(x=>x.vector).join('-');
 const dest=code==='27-07-15-32-12-30'?'ABYDOS':code==='28-26-05-36-11-29'?'EARTH':'UNLISTED ADDRESS';
 setText('destinationName',dest);setText('addressHeader',code);
 const now=new Date();setText('clockText',now.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}));setText('dateText',now.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'2-digit'}));
}
function buildRing(){
 const g=$('rotatingRing');
 [286,274,262,236,219].forEach((r,i)=>svg('circle',{cx,cy,r,fill:'none',class:i<2?'gate-fixed-dim':'gate-fixed',opacity:i===4?.55:1},g));
 const tickGroup=svg('g',{},g);
 for(let i=0;i<184;i++){
  const a=(-90+i*360/184)*Math.PI/180;const major=i%4===0;const r1=major?264:268,r2=major?282:277;
  svg('line',{x1:cx+Math.cos(a)*r1,y1:cy+Math.sin(a)*r1,x2:cx+Math.cos(a)*r2,y2:cy+Math.sin(a)*r2,class:'ring-tick'+(major?' major':'')},tickGroup);
 }
 const symGroup=svg('g',{},g);
 map.forEach(item=>{
  const a=(-90+(item.n-1)*360/39)*Math.PI/180;const x=cx+Math.cos(a)*238,y=cy+Math.sin(a)*238;
  const t=svg('text',{x,y,class:'ring-symbol'+(item.n===1?' origin':''),transform:`rotate(${(-90+(item.n-1)*360/39)+90} ${x.toFixed(1)} ${y.toFixed(1)})`},symGroup);
  t.textContent=item.key;t.dataset.vector=item.vector;
 });
}
function buildChevrons(){
 const g=$('chevronLayer');
 physicalAngles.forEach((angle,index)=>{
  const a=angle*Math.PI/180,x=cx+Math.cos(a)*292,y=cy-Math.sin(a)*292;
  const gr=svg('g',{transform:`translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${90-angle})`,class:'chevron-wrap',id:'chev'+angle},g);
  svg('path',{d:'M-25 -15 L0 17 L25 -15 L17 -15 L0 7 L-17 -15 Z',class:'chevron'+(index===4||index===5?' unused':'')},gr);
  svg('path',{d:'M-14 -10 L0 8 L14 -10',fill:'none',stroke:'#79cce8','stroke-width':1.5,opacity:.55},gr);
 });
}
function buildResults(){
 const g=$('resultBoxLayer');
 for(let i=0;i<7;i++){
  const y=165+i*117.5;
  const group=svg('g',{id:'result'+i},g);
  svg('text',{x:1207,y:y+61,class:'result-index'},group).textContent=String(i+1);
  svg('rect',{x:1238,y,width:129,height:101,rx:2,class:'result-box',id:'resultBox'+i},group);
  svg('line',{x1:1238,y1:y+3,x2:1367,y2:y+3,class:'result-top'},group);
  svg('text',{x:1302.5,y:y+54,class:'result-glyph',id:'resultGlyph'+i},group);
  svg('text',{x:1302.5,y:y+88,class:'result-code',id:'resultCode'+i},group);
 }
}
function buildCircuits(){
 const g=$('circuitLayer');
 lockAngles.forEach((angle,i)=>{
  const a=angle*Math.PI/180;const tx=cx+Math.cos(a)*292,ty=cy-Math.sin(a)*292;const boxY=165+i*117.5+50;
  let d;
  if(i<3){d=`M 1238 ${boxY.toFixed(1)} L 1150 ${boxY.toFixed(1)} L ${tx.toFixed(1)} ${ty.toFixed(1)}`;}
  else {const lane=1400+(i-3)*11,rail=145-i*10;d=`M 1367 ${boxY.toFixed(1)} L ${lane} ${boxY.toFixed(1)} L ${lane} ${rail} L 305 ${rail} L 305 ${ty.toFixed(1)} L ${tx.toFixed(1)} ${ty.toFixed(1)}`;}
  const path=svg('path',{d,class:'circuit',id:'circuit'+i},g);
 });
}
function buildChecklist(){
 const g=$('checklist');
 for(let i=0;i<7;i++){
  const y=765+i*33;
  svg('rect',{x:83,y:y-14,width:14,height:14,class:'check-box',id:'checkBox'+i},g);
  svg('rect',{x:105,y:y-12,width:42,height:8,rx:1,class:'left-bar',id:'checkBar'+i},g);
  svg('text',{x:167,y:y+4,class:'check-text'},g).textContent=String(i+1);
  svg('text',{x:190,y:y+3,class:'check-ok',id:'checkText'+i},g).textContent='';
  svg('rect',{x:249,y:y-14,width:15,height:14,class:'check-row'},g);
 }
}
function buildProgress(){
 const g=$('progressSegments');
 for(let i=0;i<7;i++){svg('rect',{x:332+i*115,y:1010,width:102,height:12,class:'progress-seg',id:'pseg'+i},g);}
 const auth=$('authSegments');
 for(let i=0;i<13;i++){const x=628+i*39;svg('rect',{x,y:1016,width:31,height:18,class:'hud-thin',opacity:.9},auth);}
}
function validateAddress(raw){
 const tokens=String(raw).trim().split(/[-\s,;|]+/).filter(Boolean);
 if(tokens.length!==6)throw new Error('Indirizzo non valido: servono sei codici vettoriali.');
 if(tokens.some(t=>!/^\d{1,2}$/.test(t)))throw new Error('Codice non valido: ogni elemento deve essere un numero da 01 a 39.');
 const nums=tokens.map(Number);if(nums.some(n=>n<2||n>39))throw new Error('Il vettore 01 è riservato all’origine; i codici di destinazione validi sono 02–39.');
 const normalized=nums.map(n=>String(n).padStart(2,'0'));if(new Set(normalized).size!==6)throw new Error('Indirizzo non valido: i sei glifi devono essere unici.');
 return normalized.map(v=>byVector.get(v)).concat(byVector.get('01'));
}
function nearestEquivalentAngle(target,current){
 // SVG positive angles run clockwise on screen. Pick the equivalent target
 // within +/-180 degrees of the current ring position to avoid near-full spins.
 return target + 360 * Math.round((current - target) / 360);
}
function ringTransform(degrees){
 // Keep the rotation pivot in SVG user-space. Explicit translate/rotate/translate
 // avoids CSS transform-origin being interpreted against the rendered SVG box.
 return `translate(${cx} ${cy}) rotate(${degrees}) translate(${-cx} ${-cy})`;
}
function animateRing(to,duration=750){
 const from=rotationNow,start=performance.now();
 return new Promise(resolve=>{
  function frame(now){
   const t=Math.min(1,(now-start)/duration);
   const ease=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
   rotationNow=from+(to-from)*ease;
   $('rotatingRing').setAttribute('transform',ringTransform(rotationNow));
   if(t<1)requestAnimationFrame(frame);else{rotationNow=to;$('rotatingRing').setAttribute('transform',ringTransform(to));resolve();}
  }
  requestAnimationFrame(frame);
 });
}
function ringTargetForChevron(item,chevronAngle){
 // Glyph positions use SVG coordinates (0° right, +90° down). The chevron
 // layout is authored with an inverted Y axis, so its matching SVG angle is -chevronAngle.
 const glyphAngle=-90+(item.n-1)*360/39;
 const desiredSvgAngle=-chevronAngle;
 const canonicalTarget=desiredSvgAngle-glyphAngle;
 return nearestEquivalentAngle(canonicalTarget,rotationNow);
}
function animateFly(item,index,duration=620){
 const el=$('flyGlyph'),boxY=165+index*117.5+54;const start={x:cx,y:cy+10,size:210};const end={x:1302.5,y:boxY,size:51};const startTime=performance.now();
 el.textContent=item.key;el.setAttribute('opacity','1');
 return new Promise(resolve=>{
  function frame(now){const t=Math.min(1,(now-startTime)/duration),e=1-Math.pow(1-t,3);el.setAttribute('x',(start.x+(end.x-start.x)*e).toFixed(1));el.setAttribute('y',(start.y+(end.y-start.y)*e).toFixed(1));el.setAttribute('font-size',(start.size+(end.size-start.size)*e).toFixed(1));el.setAttribute('opacity',String(1-.35*e));if(t<1)requestAnimationFrame(frame);else{el.setAttribute('opacity','0');resolve();}}
  requestAnimationFrame(frame);
 });
}
function markLocked(index,item){
 const angle=lockAngles[index];const chev=$('chev'+angle);if(chev){const p=chev.querySelector('path');if(p)p.classList.add('active');}
 $('circuit'+index)?.classList.add('active');$('resultBox'+index).classList.add('active');
 const glyph=$('resultGlyph'+index);glyph.textContent=item.key;glyph.classList.add('visible');$('resultCode'+index).textContent='VEC '+item.vector;
 $('checkBox'+index).classList.add('done');$('checkBar'+index).classList.add('done');setText('checkText'+index,'OK');$('pseg'+index).classList.add('done');
}
function heroShow(item){const h=$('heroGlyph');h.textContent=item.key;h.setAttribute('opacity','1');return wait(340).then(()=>h.setAttribute('opacity','0'));}
async function runSequence(){
 if(running)return;running=true;stopRequested=false;$('replayBtn').disabled=true;
 // Reset the animation-only layers; the entered address itself remains unchanged.
 rotationNow=0;$('rotatingRing').setAttribute('transform',ringTransform(0));
 for(let i=0;i<7;i++){
  const angle=lockAngles[i],item=selected[i];
  if(stopRequested)break;
  setText('statusLabel','STATUS: DIALING SEQUENCE');setText('sequenceStatus','SEQUENCE IN PROGRESS');
  const target=ringTargetForChevron(item,angle);
  await animateRing(target,820);if(stopRequested)break;
  await heroShow(item);if(stopRequested)break;
  await animateFly(item,i,700);if(stopRequested)break;
  markLocked(i,item);
  setText('sequenceStatus',i===6?'SEQUENCE COMPLETE':'SEQUENCE IN PROGRESS');
  await wait(i===6?900:360);
 }
 if(!stopRequested){setText('statusLabel','STATUS: SEQUENCE COMPLETE');setText('sequenceStatus','SEQUENCE COMPLETE');$('replayBtn').disabled=false;}
 else {setText('statusLabel','STATUS: SEQUENCE ABORTED');setText('sequenceStatus','SEQUENCE ABORTED');$('replayBtn').disabled=false;}
 running=false;
}
function resetDisplay(){
 stopRequested=true;
 for(let i=0;i<7;i++){
  const a=lockAngles[i],chev=$('chev'+a);if(chev){chev.querySelector('path')?.classList.remove('active');}
  $('circuit'+i).classList.remove('active');$('resultBox'+i).classList.remove('active');$('resultGlyph'+i).textContent='';$('resultGlyph'+i).classList.remove('visible');$('resultCode'+i).textContent='';$('checkBox'+i).classList.remove('done');$('checkBar'+i).classList.remove('done');setText('checkText'+i,'');$('pseg'+i).classList.remove('done');
 }
 $('heroGlyph').setAttribute('opacity','0');$('flyGlyph').setAttribute('opacity','0');
 setText('statusLabel','STATUS: DIALING SEQUENCE');setText('sequenceStatus','SEQUENCE IN PROGRESS');
}
function init(){
 $('backBtn').onclick=()=>{const p=new URLSearchParams();if(addressRaw)p.set('address',addressRaw);p.set('mode',sourceMode);location.href='preview.html?'+p.toString();};
 try{selected=validateAddress(addressRaw);}catch(err){setText('statusLabel','STATUS: INVALID ADDRESS');setText('sequenceStatus',err.message.toUpperCase());$('replayBtn').disabled=true;return;}
 // The seven-symbol list always has six destination vectors followed by origin vector 01.
 setDestinationLabel();setText('addressHeader',selected.slice(0,6).map(x=>x.vector).join('-'));
 buildRing();buildChevrons();buildResults();buildCircuits();buildChecklist();buildProgress();
 const auth=selected.slice(0,6).map(x=>x.vector).join('');
 for(let i=0;i<13;i++){const t=svg('text',{x:643+i*39,y:1031,class:'hud-text tiny', 'text-anchor':'middle'},$('authSegments'));t.textContent=auth[i]||'·';}
 if(!document.fonts.check('24px SGCGlyph'))$('fontNotice').hidden=false;
 $('backBtn').onclick=()=>{const p=new URLSearchParams({address:selected.slice(0,6).map(x=>x.vector).join('-'),mode:sourceMode});location.href='preview.html?'+p.toString();};
 $('replayBtn').onclick=()=>{resetDisplay();setTimeout(()=>runSequence(),80);};
 runSequence();
}
init();
</script>
